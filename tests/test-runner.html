<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Math Studio — Automated Test Runner</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-sec: #94a3b8;
            --pass: #34d399;
            --fail: #fb7185;
            --cyan: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        h1 { font-size: 22px; margin: 0; }
        .btn-run {
            background: var(--cyan);
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .metrics-card {
            display: flex;
            gap: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .metric-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .metric-val {
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
        }
        .metric-val.passed { color: var(--pass); }
        .metric-val.failed { color: var(--fail); }
        .test-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .test-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 13px;
        }
        .test-row.pass { border-left: 4px solid var(--pass); }
        .test-row.fail { border-left: 4px solid var(--fail); }
        .status-tag {
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .status-tag.pass { background: rgba(52, 211, 153, 0.2); color: var(--pass); }
        .status-tag.fail { background: rgba(251, 113, 133, 0.2); color: var(--fail); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🧪 Antigravity Math Studio Test Suite</h1>
                <p style="color: var(--text-sec); margin-top: 4px; font-size: 13px;">Full unit & regression test suite execution in the browser</p>
            </div>
            <button class="btn-run" id="btnRerun">Re-run Tests</button>
        </header>

        <div class="metrics-card">
            <div class="metric-item">
                <span style="color: var(--text-sec); font-size: 12px; text-transform: uppercase;">Passed</span>
                <span class="metric-val passed" id="passedCount">0</span>
            </div>
            <div class="metric-item">
                <span style="color: var(--text-sec); font-size: 12px; text-transform: uppercase;">Failed</span>
                <span class="metric-val failed" id="failedCount">0</span>
            </div>
            <div class="metric-item">
                <span style="color: var(--text-sec); font-size: 12px; text-transform: uppercase;">Total</span>
                <span class="metric-val" id="totalCount">0</span>
            </div>
        </div>

        <div class="test-list" id="testList">
            <div style="text-align: center; color: var(--text-sec); padding: 40px;">Running tests...</div>
        </div>
    </div>

    <script type="module">
        import { Evaluator } from '../engine/evaluator.js';
        import { MathFormat } from '../engine/fractions.js';
        import { Explainer } from '../engine/explainer.js';
        import { EquationSolver } from '../engine/solver.js';
        import { MatrixEngine } from '../engine/matrix.js';
        import { StatisticsEngine } from '../engine/stats.js';
        import { ProgrammerEngine } from '../modules/programmer.js';
        import { UnitEngine } from '../engine/units.js';

        function runBrowserTests() {
            const list = document.getElementById('testList');
            list.innerHTML = '';
            let passed = 0, failed = 0;

            function assert(cond, name, details = '') {
                const row = document.createElement('div');
                row.className = `test-row ${cond ? 'pass' : 'fail'}`;
                row.innerHTML = `
                    <span>${name} ${details ? '<span style="color:var(--text-sec);">(' + details + ')</span>' : ''}</span>
                    <span class="status-tag ${cond ? 'pass' : 'fail'}">${cond ? 'PASS' : 'FAIL'}</span>
                `;
                list.appendChild(row);
                if (cond) passed++; else failed++;
            }

            const ev = new Evaluator();
            assert(ev.evaluate('2 + 3 * 4').value === 14, '2 + 3 * 4 = 14');
            assert(ev.evaluate('0.1 + 0.2').value === 0.3, '0.1 + 0.2 = 0.3 (precision normalization)');
            assert(ev.evaluate('(2 + 3)^4').value === 625, '(2 + 3)^4 = 625');
            assert(ev.evaluate('5!').value === 120, '5! = 120');

            const evDeg = new Evaluator({ angleMode: 'deg' });
            assert(evDeg.evaluate('sin(30)').value === 0.5, 'sin(30°) = 0.5');
            assert(evDeg.evaluate('asin(0.5)').value === 30, 'asin(0.5) = 30°');
            assert(evDeg.evaluate('2π').value > 6.28, 'Implicit multiplication 2π');

            const frac = MathFormat.toFraction(0.75);
            assert(frac && frac.string === '3/4', '0.75 converts to 3/4');

            const solver = new EquationSolver();
            const lin = solver.solve('2x + 5 = 15');
            assert(lin.solutions[0] === '5', 'Solves 2x + 5 = 15 -> x = 5');

            const quad = solver.solve('x^2 - 5x + 6 = 0');
            assert(quad.numericSolutions.includes(3) && quad.numericSolutions.includes(2), 'x^2 - 5x + 6 = 0 roots 3 and 2');

            const det = MatrixEngine.determinant([[1, 2], [3, 4]]);
            assert(det === -2, 'Matrix det([[1,2],[3,4]]) = -2');

            const s = StatisticsEngine.analyze([12, 15, 18, 20, 25]);
            assert(s.mean === 18 && s.median === 18, 'Statistics mean and median = 18');

            const prog = new ProgrammerEngine();
            prog.setValue(42);
            assert(prog.getHex() === '000000000000002A', 'Programmer HEX representation of 42');

            const nlp = UnitEngine.parseNaturalLanguage('10 km to miles');
            assert(nlp && Math.abs(nlp.result - 6.2137) < 0.01, 'Unit NLP "10 km to miles"');

            document.getElementById('passedCount').textContent = passed;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('totalCount').textContent = passed + failed;
        }

        document.getElementById('btnRerun').addEventListener('click', runBrowserTests);
        runBrowserTests();
    </script>
</body>
</html>
